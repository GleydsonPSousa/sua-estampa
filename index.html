<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sua Estampa – Portal</title>
<style>
:root{--bg:#f7f1e6;--card:#fffdf8;--tx:#192d48;--mu:#74705f;--bd:#e6dccb;--nv:#192d48;--btn:#192d48;--cu:#a0572e;--ok:#1a7f4b;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1626;--card:#16233f;--tx:#f4ecdd;--mu:#a9a393;--bd:#2b3a5c;--nv:#1d3358;--btn:#c8693a;--cu:#e08a52;--ok:#4cc38a;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#0d1626;--card:#16233f;--tx:#f4ecdd;--mu:#a9a393;--bd:#2b3a5c;--nv:#1d3358;--btn:#c8693a;--cu:#e08a52;--ok:#4cc38a;--bad:#ff7a6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:var(--bg)}body{margin:0;background:transparent;color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:0 16px 150px}
.ban{position:absolute;top:0;left:0;right:0;height:400px;z-index:-1;overflow:hidden;background:#0d1626}.ban video{width:100%;height:100%;object-fit:cover}.ban:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,22,38,.55),rgba(13,22,38,.3) 45%,var(--bg))}body.in .ban{height:240px}body.in.cl .ban{height:300px}body.in:not(.cl) .ban:after{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 50%,transparent),var(--bg))}
@media(prefers-reduced-motion:reduce){.ban video{display:none}}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{width:100%;padding:13px;margin:0 0 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--cu)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 5px;color:var(--mu)}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--btn);color:#fff;font-weight:700}
.btn:active,.fab:active{transform:scale(.97)}
.hero{background:linear-gradient(160deg,var(--nv),#0f1c30);color:#f4ecdd;margin:0 -16px 0;padding:28px 20px 56px;text-align:center;border-radius:0 0 32px 32px}
.hero img{width:120px;height:120px;border-radius:50%;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hero p{margin:12px 0 0;opacity:.85;font-size:15px}
.panel{background:var(--card);border-radius:22px;padding:18px;margin-top:-34px;position:relative;box-shadow:0 10px 30px rgba(25,45,72,.14);animation:up .4s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.seg{position:relative;display:flex;background:var(--bd);border-radius:12px;padding:4px;margin-bottom:16px}
.seg:before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:9px;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg[data-r="1"]:before{transform:translateX(100%)}
.seg button{flex:1;padding:10px;position:relative;font-weight:600;color:var(--mu)}.seg .on{color:var(--tx)}
.pw{position:relative}.pw input{padding-right:48px}.pw button{position:absolute;right:4px;top:4px;width:44px;height:44px;font-size:18px}
.err{background:rgba(192,57,43,.12);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin:0 0 12px}
.top{display:flex;align-items:center;gap:12px;padding:16px 0}.top img{width:44px;height:44px;border-radius:50%}.top div{flex:1}.top b{display:block;font-family:Georgia,serif;font-size:18px}.top span{font-size:13px;color:var(--mu);text-transform:capitalize}
.out{padding:8px 12px;border:1px solid var(--bd);border-radius:10px;font-size:14px;color:var(--mu)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.k{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--bd)}.k b{display:block;font:700 28px Georgia,serif}.k span{font-size:13px;color:var(--mu)}
.k.m{background:var(--nv);color:#f4ecdd;grid-column:1/3}.k.m span{color:#d9cdb8}
h3{font-size:17px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(25,45,72,.06);animation:up .3s}
.hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.hd strong{font-size:16px}
.mu{color:var(--mu);font-size:14px}
.tg{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd);white-space:nowrap}.tg.bad{background:var(--bad);color:#fff}.tg.ok{background:var(--ok);color:#fff}
.st{display:flex;margin:16px 0 6px}.s{flex:1;text-align:center;position:relative;font-size:10px;color:var(--mu)}
.s i{display:grid;place-items:center;width:24px;height:24px;margin:0 auto 4px;border-radius:50%;background:var(--bd);font-style:normal;font-weight:700;font-size:11px;position:relative;z-index:1}
.s:not(:first-child):before{content:"";position:absolute;top:11px;right:50%;width:100%;height:2px;background:var(--bd)}
.s.d i,.s.c i{background:var(--cu);color:#fff}.s.d:not(:first-child):before,.s.c:not(:first-child):before{background:var(--cu)}
.s.c span{color:var(--tx);font-weight:700}.s.c i{box-shadow:0 0 0 4px rgba(160,87,46,.22)}
.msg{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.acts{display:flex;gap:8px;margin-top:12px}.acts .adv{flex:1;padding:11px;border-radius:10px;background:var(--btn);color:#fff;font-weight:700;font-size:14px}
.acts .sm{padding:11px 14px;border-radius:10px;border:1px solid var(--bd);color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips button{padding:8px 14px;border-radius:99px;border:1.5px solid var(--bd);white-space:nowrap;font-size:14px;font-weight:600;color:var(--mu)}.chips .on{background:var(--nv);border-color:var(--nv);color:#fff}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}.car::-webkit-scrollbar{display:none}
.pk{flex:0 0 76%;max-width:300px;scroll-snap-align:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(25,45,72,.08)}
.im{height:170px;background-size:cover;background-position:center;display:grid;place-items:center;position:relative}.im big{font-size:56px}.im .tg{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#192d48}
.pb{padding:12px 14px 14px}.pb p{margin:4px 0 0}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 4px}.dots i{width:7px;height:7px;border-radius:99px;background:var(--bd);transition:all .25s}.dots i.on{width:20px;background:var(--cu)}
.emp{text-align:center;padding:36px 12px;color:var(--mu)}.emp big{display:block;font-size:40px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:15px 20px;border-radius:99px;background:var(--cu);color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;padding:6px;font-size:12px;color:var(--mu);font-weight:600}nav button b{display:block;font-size:21px;font-weight:400}nav .on{color:var(--cu)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:flex-end;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sh{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .25s}
.sh h2{margin-bottom:14px}.row{display:flex;gap:10px}.row>div{flex:1}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--nv);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:20;transition:transform .3s}#toast.on{transform:translate(-50%,0)}
.chw{display:flex;flex-wrap:wrap;gap:8px}.chw button:not(.sw){padding:8px 14px;border-radius:99px;border:1.5px solid var(--bd);font-size:14px;font-weight:600;color:var(--mu)}.chw .on:not(.sw){background:var(--nv);border-color:var(--nv);color:#fff}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd)}.sw.on{box-shadow:0 0 0 3px var(--cu)}
.row2{display:flex;gap:10px;margin-top:4px}.row2 .btn{flex:1}
.mkb{display:block;width:100%;text-align:left;margin-top:16px}.mkb b{display:block;font-family:Georgia,serif;font-size:17px}
#mkp svg{display:block;max-width:340px;margin:0 auto}
.gr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.stp{display:flex;align-items:center;gap:14px}.stp button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bd);font-size:20px;line-height:1}.stp b{min-width:24px;text-align:center}
.wab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:8}.wab:active{transform:scale(.94)}.wab svg{width:32px;height:32px;fill:#fff}
.mur{margin:26px 0 0}.mur h2{font-size:22px}.mur h3{margin:22px 0 10px;font-size:16px}
.cs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}.cs::-webkit-scrollbar{display:none}
.cc{flex:0 0 62%;max-width:240px;scroll-snap-align:start;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--nv);box-shadow:0 4px 16px rgba(25,45,72,.18);text-align:left}
.cc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cc:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,18,32,.88),rgba(10,18,32,0) 55%)}
.cc div{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff}.cc b{display:block;font:700 17px/1.2 Georgia,serif}.cc span{font-size:12.5px;opacity:.88}
.cc i{position:absolute;top:10px;left:10px;z-index:1;font-style:normal;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.92);color:#192d48}
.cc.cta{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px;background:linear-gradient(135deg,#c8693a,#7a3b1a);color:#fff}.cc.cta:after{display:none}.cc.cta:active{transform:scale(.97)}
.qt{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--cu);border-radius:18px;padding:16px;margin-bottom:10px}
.qt p{margin:0 0 12px;font:italic 16px/1.45 Georgia,serif}.qt div{display:flex;align-items:center;gap:10px;font-size:14px}
.qt em{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--bd);font-size:18px}.qt small{color:var(--mu);font-size:12px}
html{scroll-behavior:smooth}
.ban video{height:130%}
.car,.cs{position:relative;padding-top:16px;padding-bottom:20px;margin-top:-6px;margin-bottom:-6px}
.car{padding-left:calc(50% + 16px - min(35vw,145px));padding-right:calc(50% + 16px - min(35vw,145px))}
.cs{padding-left:calc(50% + 16px - min(31vw,120px));padding-right:calc(50% + 16px - min(31vw,120px))}
.pk{flex:0 0 min(70vw,290px);max-width:none}
.cc{flex:0 0 min(62vw,240px);max-width:none;scroll-snap-align:center}
.pk,.cc{backface-visibility:hidden;transition:transform .18s ease-out,opacity .18s}
.cc img,.pk .im{transform:scale(var(--z,1));transition:transform .35s ease-out}
.hero img{animation:flt 6s ease-in-out infinite}
.btn{position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s}
.btn:hover{box-shadow:0 8px 20px rgba(25,45,72,.25)}
button[data-y="logo"]:not(.cc){position:relative;overflow:hidden}
button[data-y="logo"]:not(.cc):after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:shn 4.5s ease-in-out infinite}
.qt,.k{transition:transform .25s,box-shadow .25s}
@media(hover:hover){.qt:hover,.k:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(25,45,72,.16)}}
.wab:before{content:"";position:absolute;inset:0;border-radius:50%;background:#25d366;opacity:.5;z-index:-1;animation:png 2.6s ease-out infinite}
.wab{animation:pop .6s .5s both cubic-bezier(.2,1.5,.4,1)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in2{opacity:1;transform:none}
#app.nr .card,#app.nr .panel{animation:none}
.lowfx .hero img,.lowfx .wab,.lowfx .wab:before,.lowfx button[data-y="logo"]:not(.cc):after{animation:none}
@keyframes flt{50%{transform:translateY(-7px)}}
@keyframes shn{0%,55%{left:-60%}100%{left:140%}}
@keyframes png{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(1.7);opacity:0}}
@keyframes pop{from{transform:scale(0)}}
@media(prefers-reduced-motion:reduce){.hero img,.wab,.wab:before,button[data-y="logo"]:not(.cc):after{animation:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
